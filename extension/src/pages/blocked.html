<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title data-i18n="blocked_title">Site Blocked — Safety AI</title>
<script src="/i18n.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1F3A2E;
    color: #F5F0E6;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    text-align: center;
    max-width: 420px;
    padding: 40px;
  }
  .icon { font-size: 56px; margin-bottom: 20px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #B89968;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 26px;
    font-weight: 300;
    margin-bottom: 14px;
    line-height: 1.3;
  }
  p {
    font-size: 14px;
    color: rgba(245, 240, 230, 0.65);
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .divider {
    width: 60px;
    height: 1px;
    background: #B89968;
    margin: 0 auto 28px;
  }
  .domain {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(245, 240, 230, 0.4);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#128683;</div>
  <div class="label" data-i18n="access_restricted">Access Restricted</div>
  <h1 data-i18n="cant_access">Sorry, you can't access this website.</h1>
  <p data-i18n="not_approved">This AI tool isn't approved for use. Ask a trusted adult if you think you should have access.</p>
  <div class="divider"></div>
  <div class="domain" id="blockedDomain"></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const url = params.get('url') || document.referrer;
  if (url) {
    try {
      document.getElementById('blockedDomain').textContent = new URL(url).hostname;
    } catch {}
  }
</script>
</body>
</html>
